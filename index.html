<!doctype html>
<html lang="ka" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070f50" />
    <script>
      try {
        const savedTheme = localStorage.getItem("1111-theme");
        document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
        if (savedTheme === "light") document.querySelector('meta[name="theme-color"]').content = "#eef2ff";
      } catch { document.documentElement.dataset.theme = "dark"; }
    </script>
    <meta
      name="description"
      content="11:11 — სივრცე მომენტებისთვის, რომლებიც მნიშვნელოვანია."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/heritage-legacy.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/noto-serif-georgian.ttf" as="font" type="font/ttf" crossorigin />
    <title>11:11 — აქციე მომენტი განსაკუთრებულად</title>
  </head>

  </body>
</html>

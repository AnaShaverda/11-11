<!doctype html>
<html lang="ka" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070f50" />
    <link rel="preload" href="/logos/logo-pink-star.svg" as="image" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #070f50;
      }
      #boot-scene {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          #070f50 0%,
          #241346 68%,
          #923054 100%
        );
        opacity: 1;
        transition: opacity 0.22s ease;
      }
      #boot-scene.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      #boot-scene::before {
        position: absolute;
        inset: 0;
        content: "";
        background-image:
          linear-gradient(#e0279230 1px, transparent 1px),
          linear-gradient(90deg, #e0279230 1px, transparent 1px);
        background-size: 90px 90px;
        mask-image: linear-gradient(transparent 12%, #000 100%);
      }
      .boot-glow {
        position: absolute;
        width: min(72vw, 740px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, #c663b754, transparent 68%);
        filter: blur(15px);
      }
      .boot-logo {
        position: relative;
        z-index: 2;
        width: clamp(116px, 17vw, 220px);
        height: auto;
        filter: drop-shadow(0 10px 24px #100a4680);
      }
      .boot-star {
        position: absolute;
        width: var(--size);
        height: var(--size);
        left: var(--x);
        top: var(--y);
        background: #fff1fb;
        clip-path: polygon(
          50% 0,
          61% 39%,
          100% 50%,
          61% 61%,
          50% 100%,
          39% 61%,
          0 50%,
          39% 39%
        );
        opacity: 0.75;
        animation: boot-twinkle 2.4s ease-in-out infinite alternate;
        animation-delay: var(--delay);
      }
      .boot-star:nth-of-type(3n) {
        background: #ff9ad9;
      }
      @keyframes boot-twinkle {
        from {
          opacity: 0.25;
          transform: scale(0.7);
        }
        to {
          opacity: 1;
          transform: scale(1.2);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-scene {
          transition: none;
        }
        .boot-star {
          animation: none;
        }
      }
    </style>
    <script>
      try {
        const savedTheme = localStorage.getItem("1111-theme");
        document.documentElement.dataset.theme =
          savedTheme === "light" ? "light" : "dark";
        if (savedTheme === "light")
          document.querySelector('meta[name="theme-color"]').content =
            "#eef2ff";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta
      name="description"
      content="11:11 — სივრცე მომენტებისთვის, რომლებიც მნიშვნელოვანია."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/heritage-legacy.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/noto-serif-georgian.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>11:11 — აქციე მომენტი განსაკუთრებულად</title>
  </head>
  <body>
    <div id="boot-scene" role="status" aria-label="11:11 is opening">
      <span class="boot-glow" aria-hidden="true"></span>
      <span
        class="boot-star"
        style="--x: 8%; --y: 18%; --size: 17px; --delay: 0.1s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 19%; --y: 56%; --size: 8px; --delay: 0.7s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 31%; --y: 12%; --size: 11px; --delay: 1.1s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 71%; --y: 21%; --size: 9px; --delay: 0.4s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 89%; --y: 13%; --size: 18px; --delay: 1.4s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 92%; --y: 62%; --size: 11px; --delay: 0.9s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 76%; --y: 75%; --size: 7px; --delay: 1.7s"
        aria-hidden="true"
      ></span>
      <img
        class="boot-logo"
        src="/logos/logo-pink-star.svg"
        width="1330"
        height="1112"
        alt="11:11"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

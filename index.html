<!doctype html>
<html lang="ka" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070f50" />
    <link rel="preload" href="/logos/logo-pink-star.svg" as="image" />
    <link rel="stylesheet" href="/site-loader.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #070f50;
      }
    </style>
    <script>
      try {
        const savedTheme = localStorage.getItem("1111-theme");
        document.documentElement.dataset.theme =
          savedTheme === "light" ? "light" : "dark";
        if (savedTheme === "light")
          document.querySelector('meta[name="theme-color"]').content =
            "#eef2ff";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta
      name="description"
      content="11:11 — სივრცე მომენტებისთვის, რომლებიც მნიშვნელოვანია."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/heritage-legacy.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/noto-serif-georgian.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>11:11 — აქციე მომენტი განსაკუთრებულად</title>
  </head>
  <body>
    <div id="boot-scene" role="status" aria-label="11:11 is opening">
      <span class="boot-glow" aria-hidden="true"></span>
      <span
        class="boot-star"
        style="--x: 8%; --y: 18%; --size: 17px; --delay: 0.1s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 19%; --y: 56%; --size: 8px; --delay: 0.7s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 31%; --y: 12%; --size: 11px; --delay: 1.1s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 71%; --y: 21%; --size: 9px; --delay: 0.4s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 89%; --y: 13%; --size: 18px; --delay: 1.4s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 92%; --y: 62%; --size: 11px; --delay: 0.9s"
        aria-hidden="true"
      ></span>
      <span
        class="boot-star"
        style="--x: 76%; --y: 75%; --size: 7px; --delay: 1.7s"
        aria-hidden="true"
      ></span>
      <img
        class="boot-logo"
        src="/logos/logo-pink-star.svg"
        width="1330"
        height="1112"
        alt="11:11"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
